org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is disabled on purpose.
#
# This project lives on E: while the pub cache lives on C:. Kotlin's
# incremental compiler stores source paths relative to the module directory
# (RelocatableFileToPathConverter), and there is no relative path between two
# different Windows drive roots, so it throws:
#
#   IllegalArgumentException: this and base files have different roots:
#     C:\...\Pub\Cache\hosted\pub.dev\workmanager_android-0.10.6\...\BackgroundWorker.kt
#     and E:\...\app\android
#
# ...which surfaces as "Could not close incremental caches" and fails the
# build for every plugin that ships Kotlin sources (workmanager_android,
# image_picker_android, package_info_plus). Turning incremental compilation
# off makes each plugin compile from scratch - slightly slower, but correct.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
